<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .login-section {
            max-width: 500px;
            margin: 100px auto;
            text-align: center;
        }
        
        .login-btn {
            margin: 15px 0;
            width: 100%;
        }
        
        .welcome-text {
            background: #e7f3ff;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 30px;
            margin: 30px 0;
        }
        
        .welcome-text h2 {
            border: none;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Система управления пользователями</h1>
        </header>

        <main>
            <section class="form-section login-section">
                <div class="welcome-text">
                    <h2>Добро пожаловать!</h2>
                    <p>Простая система для работы с пользователями</p>
                </div>
                
                <a href="/dashboard.html" class="btn btn-primary login-btn">
                    🚀 Войти
                </a>
                
                <div style="margin-top: 30px; color: #666;">
                    <p>Регистрация и управление пользователями</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Mini API. Все права защищены.</p>
        </footer>
    </div>
</body>
</html>
