<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспорт — MiniAPI</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="site-header"><a class="brand" href="/">MiniAPI<span>Справочник пользователей</span></a>
        <nav aria-label="Основная навигация"><a href="/dashboard.html">Пользователи</a><a href="/download.html">Экспорт</a></nav>
    </header>
    <main>
        <div class="page-heading"><div><p class="eyebrow">Данные</p><h1>Экспорт пользователей</h1></div></div>
        <section class="panel export-panel"><h2>Список в формате JSON</h2><p>Экспорт содержит всех пользователей, их идентификаторы, возраст, отдел и дату добавления.</p>
            <div class="actions"><button id="downloadJson" class="btn btn-primary">Скачать JSON</button><button id="viewJson" class="btn">Просмотреть</button></div>
            <p id="exportMessage" class="message" role="status" aria-live="polite" hidden></p>
            <div id="jsonPreview" hidden><h2>Предварительный просмотр</h2><pre id="jsonContent" tabindex="0"></pre></div>
        </section></main>
    <footer>MiniAPI · Учебный проект</footer>
    <script src="/js/download.js" defer></script>
</body>
</html>
