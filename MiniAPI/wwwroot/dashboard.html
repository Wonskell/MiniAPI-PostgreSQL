<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Панель управления пользователями</h1>
            <div style="margin-top: 15px;">
                <a href="/" style="color: white; text-decoration: none; font-size: 0.9rem;">← Выход</a>
            </div>
        </header>

        <main>
            <section class="form-section">
                <h2>Регистрация нового пользователя</h2>
                <form id="registrationForm">
                    <div class="form-group">
                        <label for="name">Имя:</label>
                        <input type="text" id="name" name="name" required placeholder="Введите ваше имя">
                    </div>
                    
                    <div class="form-group">
                        <label for="age">Возраст:</label>
                        <input type="number" id="age" name="age" required min="1" max="150" placeholder="Введите ваш возраст">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
                
                <div id="message" class="message"></div>
            </section>

            <section class="users-section">
                <h2>Зарегистрированные пользователи</h2>
                <div style="margin-bottom: 20px;">
                    <button id="loadUsers" class="btn btn-secondary">Загрузить список</button>
                    <a href="/download" class="btn btn-secondary" style="display: inline-block; text-decoration: none; margin-left: 10px;">📥 Скачать JSON</a>
                </div>
                <div id="usersList" class="users-list"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Mini API. Все права защищены.</p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
